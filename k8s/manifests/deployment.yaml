apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-board
  labels:
    app: devops-task-board
spec:
  # spec.replicas убираем/Flux игнорирует, так как теперь количеством реплик управляет HPA!
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-task-board
  template:
    metadata:
      labels:
        app: devops-task-board
    spec:
      # BEST PRACTICE: Отказоустойчивое распределение подов по разным нодам кластера
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - devops-task-board
              topologyKey: "kubernetes.io/hostname"
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: container
        image: ghcr.io/maksimsolapai-gif/jenkins-docker-k8s-pipeline:23 # {"$imagepolicy": "flux-system:taskboard-image-policy"}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        # BEST PRACTICE: Жесткие лимиты ресурсов для защиты нод и расчета метрик HPA
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        # ИСПРАВЛЕНО: Полная блокировка прав доступа на уровне контейнера под требования Kube-linter
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: database-storage
          mountPath: /app/data
        # БЕЗОПАСНОСТЬ: Выделяем FastAPI изолированную временную память для кэша Uvicorn
        - name: ephemeral-tmp
          mountPath: /tmp
      volumes:
      - name: database-storage
        # ИСПРАВЛЕНО: возвращаем нативный сетевой NFS диск для сохранения состояния при масштабировании
        persistentVolumeClaim:
          claimName: devops-task-board-pvc
      # Декларируем RAM-диск для системных нужд Python
      - name: ephemeral-tmp
        emptyDir: {}
