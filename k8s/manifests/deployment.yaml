apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-board
  labels:
    app: devops-task-board
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-task-board
  template:
    metadata:
      labels:
        app: devops-task-board
    spec:
      # КРИТИЧЕСКИ ВАЖНО: Связываем деплоймент с секретом, который расшифровал kubeseal
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: container
        # Flux будет автоматически заменять тег на этой строчке:
        image: ghcr.io/maksimsolapai-gif/jenkins-docker-k8s-pipeline:gh-5 # {"$imagepolicy": "flux-system:taskboard-image-policy"}
        imagePullPolicy: Always

        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: database-storage
          mountPath: /app/data
      volumes:
      - name: database-storage
        persistentVolumeClaim:
          claimName: devops-task-board-pvc
