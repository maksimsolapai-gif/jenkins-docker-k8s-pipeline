apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-board
  labels:
    app: devops-task-board
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-task-board
  template:
    metadata:
      labels:
        app: devops-task-board
    spec:
      # Назначаем права пользователя 10001 для всех смонтированных K8s-дисков
      securityContext:
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - devops-task-board
              topologyKey: "kubernetes.io/hostname"
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: container
        image: ghcr.io/maksimsolapai-gif/jenkins-docker-k8s-pipeline:26 # {"$imagepolicy": "flux-system:taskboard-image-policy"}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: database-storage
          mountPath: /app/data
        # Монтируем RAM-диски во все потенциальные системные временные директории
        - name: ephemeral-tmp
          mountPath: /tmp
        - name: ephemeral-vartmp
          mountPath: /var/tmp
        - name: ephemeral-shm
          mountPath: /dev/shm
      volumes:
      - name: database-storage
        persistentVolumeClaim:
          claimName: devops-task-board-pvc
      # Декларируем RAM-диски в оперативной памяти ноды для безопасных транзакций
      - name: ephemeral-tmp
        emptyDir: {}
      - name: ephemeral-vartmp
        emptyDir: {}
      - name: ephemeral-shm
        emptyDir:
          medium: Memory # Инициализируем истинную Shared Memory для SQLite-блокировок
