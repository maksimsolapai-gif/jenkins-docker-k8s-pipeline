apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: devops-task-board-gateway
spec:
  selector:
    istio: ingressgateway # Используем стандартный ingressgateway кластера
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    # Указываем доменное имя вашего экзаменационного приложения
    - "taskboard.k8s-7.sa"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devops-task-board-virtualservice
spec:
  hosts:
  - "taskboard.k8s-7.sa"
  gateways:
  - devops-task-board-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        # Трафик по умолчанию идет на Production инстанс сервиса в пространстве prod
        host: devops-task-board-service.prod.svc.cluster.local
        port:
          number: 80
