apiVersion: batch/v1
kind: Job
metadata:
  name: hpa-load-generator-job
  namespace: prod
spec:
  ttlSecondsAfterFinished: 50
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      restartPolicy: Never
      containers:
      - name: generator
        image: busybox:1.28
        command: 
        - /bin/sh
        - -c
        - |
          echo "🚀 Старт нагрузочного тестирования для HPA..."
          i=1
          while [ $i -le 50000 ]
          do
            wget -q -O- http://devops-task-board:8080/ > /dev/null
            i=$((i+1))
          done
          echo "✅ Нагрузочный тест завершен! 50 000 запросов отправлено."
        # ИСПРАВЛЕНО ПОД ТРЕБОВАНИЯ KUBE-LINTER
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
