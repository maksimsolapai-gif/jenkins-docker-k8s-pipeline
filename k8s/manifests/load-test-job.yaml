apiVersion: batch/v1
kind: Job
metadata:
  name: hpa-load-generator-job
  namespace: prod
spec:
  ttlSecondsAfterFinished: 30
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      restartPolicy: Never
      containers:
      - name: generator
        # Используем официальный легковесный образ с утилитой hey
        image: williamyeh/hey:latest
        # -z 60s — крутить тест ровно 60 секунд
        # -c 50  — поддерживать 50 одновременных соединений
        command:
        - hey
        - -z
        - 60s
        - -c
        - 50
        - http://cluster.local
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
