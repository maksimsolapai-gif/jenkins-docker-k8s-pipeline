apiVersion: batch/v1
kind: Job
metadata:
  name: hpa-load-generator-job
  namespace: prod
spec:
  # Время жизни выполненного пода после завершения (30 секунд), чтобы он сам удалялся из k9s
  ttlSecondsAfterFinished: 30
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      restartPolicy: Never
      containers:
      - name: generator
        image: busybox:1.28
        # ИСПРАВЛЕНО: Цикл работает ровно 60 секунд, после чего под успешно завершается!
        command: 
        - /bin/sh
        - -c
        - |
          echo "🚀 Старт нагрузочного тестирования на 60 секунд..."
          END_TIME=$(( $(date +%s) + 60 ))
          while [ $(date +%s) -lt $END_TIME ]
          do
            wget -q -O- http://devops-task-board:8080/ > /dev/null
            sleep 0.001
          done
          echo "✅ 60 секунд истекли. Нагрузочный тест успешно завершен!"
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
