apiVersion: batch/v1
kind: Job
metadata:
  name: hpa-load-generator-job
  namespace: prod
spec:
  ttlSecondsAfterFinished: 30
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      restartPolicy: Never
      containers:
      - name: generator
        image: williamyeh/hey:latest
        # ИСПРАВЛЕНО: передаем параметры в args в виде строгого массива строк
        args:
        - "-z"
        - "60s"
        - "-c"
        - "50"
        - "http://cluster.local"
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
