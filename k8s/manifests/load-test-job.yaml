apiVersion: batch/v1
kind: Job
metadata:
  name: hpa-load-generator-job
  namespace: prod
spec:
  ttlSecondsAfterFinished: 30
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      restartPolicy: Never
      containers:
      - name: generator
        image: busybox:1.28
        command: 
        - /bin/sh
        - -c
        - |
          echo "🚀 Старт нагрузочного тестирования на 60 секунд..."
          END_TIME=$(( $(date +%s) + 60 ))
          while [ $(date +%s) -lt $END_TIME ]
          do
            # ИСПРАВЛЕНО: Стучимся по полному внутреннему DNS-имени Kubernetes сервиса
            wget -q -O- http://cluster.local > /dev/null
            sleep 0.001
          done
          echo "✅ Нагрузочный тест завершен!"
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
