name: Cleanup Old GitHub Packages

on:
  schedule:
    # Запуск каждый понедельник в 00:00
    - cron: '0 0 * * 1'
  workflow_dispatch: # Позволяет запускать вручную в любое время

jobs:
  package-cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete old container versions
        uses: actions/delete-package-versions@v5
        with:
          # Точное имя пакета со скриншота
          package-name: 'jenkins-docker-k8s-pipeline'
          package-type: 'container'
          # Оставляем ровно 5 последних версий (на скрине видны 33, 32, 31, 30, 29 и т.д.)
          min-versions-to-keep: 5
