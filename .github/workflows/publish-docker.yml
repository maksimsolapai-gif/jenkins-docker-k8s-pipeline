name: Publish Docker Image

on:
  push:
    branches:
      - main

    # СБОРКА ТРИГГЕРИТСЯ ТОЛЬКО ПРИ ИЗМЕНЕНИИ ЭТИХ ФАЙЛОВ И ПАПОК:

    paths:
      - 'main.py'          # Главный бэкенд-код приложения
      - 'templates/**'     # Любые изменения в веб-интерфейсе UI
      - 'Dockerfile'       # Изменения в самом Docker-конвейере
      - '.dockerignore'    # Обновление правил исключения сборщика

env:
  REGISTRY: ghcr.io
  # GitHub автоматически подставит имя вашего репозитория (в нижнем регистре)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GitHub автоматически генерирует этот токен для каждого запуска, секреты в Jenkins на этот шаг не нужны!
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # НАСТРОЙКА ТЕГОВ: Генерируем два тега для каждого билда
          tags: |
            type=raw,value=gh-${{ github.run_number }}
            type=raw,value=latest


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
