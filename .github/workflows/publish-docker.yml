name: Hybrid CI/CD Security & Automation Pipeline

on:
  push:
    branches:
      - main
    # СБОРКА ТРИГГЕРИТСЯ ТОЛЬКО ПРИ ИЗМЕНЕНИИ ЭТИХ ФАЙЛОВ И ПАПОК:
    paths:
      - 'main.py'          # Главный бэкенд-код приложения
      - 'templates/**'     # Любые изменения в веб-интерфейсе UI
      - 'tests/**'         # Изменения в автоматических тестах
      - 'Dockerfile'       # Изменения в самом Docker-конвейере
      - '.dockerignore'    # Обновление правил исключения сборщика
      - 'requirements.txt' # Обновление зависимостей пакетов

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ЭТАП 1: КОМПЛЕКСНАЯ ПРОВЕРКА БЕЗОПАСНОСТИ И ТЕСТИРОВАНИЕ
  security-and-testing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Проверка секретов: Ищем случайно забытые пароли и токены в коде
      - name: 'Security: Scan for Hardcoded Secrets (Gitleaks)'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 2. Статический анализ Dockerfile (Hadolint)
      - name: 'Lint: Static Analysis of Dockerfile (Hadolint)'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # 3. Проверка безопасности Dockerfile на запуск от Non-Root
      - name: 'Security: Verify Non-Root User in Dockerfile'
        run: |
          if ! grep -q "USER " Dockerfile; then
            echo "🚨 КРИТИЧЕСКАЯ ОШИБКА: В Dockerfile отсутствует инструкция USER! Приложение работает от root."
            exit 1
          else
            echo "✅ Успешно: Инструкция USER обнаружена в Dockerfile."
          fi

      # 4. Сканирование зависимостей Python на известные уязвимости (CVE)
      - name: 'Security: Scan Python Dependencies (Trivy)'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 5. Настройка Python окружения для запуска Pytest
      - name: 'Environment: Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 6. Установка зависимостей и утилиты покрытия кода
      - name: 'Environment: Install Test Dependencies'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install fastapi pytest httpx jinja2 python-multipart uvicorn pytest-cov
          fi

      # 7. Запуск тестов pytest с генерацией отчета Code Coverage
      - name: 'Automation: Run Pytest & Collect Code Coverage'
        run: |
          # ИСПРАВЛЕНО: Создаем системную папку /app/data на раннере и даем на нее полные права для тестов SQLite
          sudo mkdir -p /app/data
          sudo chmod -R 777 /app/data
          
          # Запуск тестирования с подсчетом покрытия кода
          PYTHONPATH=. pytest tests/ --cov=main --cov-report=term-missing -v


  # ЭТАП 2: СБОРКА И ПУШ ОБРАЗА (СТАРТУЕТ ТОЛЬКО ЕСЛИ ВСЕ ТЕСТЫ И СКАНЕРЫ ЗЕЛЕНЫЕ)
  build-and-push:
    needs: security-and-testing
    # ДОБАВЛЯЕМ СТРОКУ ОКРУЖЕНИЯ ДЛЯ АКТИВАЦИИ MANUAL GATE:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # НАСТРОЙКА ТЕГОВ: Генерируем два тега для каждого билда
          tags: |
            type=raw,value=gh-${{ github.run_number }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
